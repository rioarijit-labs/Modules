# EXAMPLE ONLY. This file lives outside .github/workflows, so GitHub never runs it here.
# Copy it into the .github/workflows folder of a separate, private "environments" repository.
#
# Assumed layout of that repository:
#   main.bicep         composes the modules, e.g. '../.modules/Azure/Bicep/res/storage/storage-account/main.bicep'
#   main.bicepparam    parameters for the environment
#
# Setup in that repository:
#   - Environments "sandbox" (what-if) and "sandbox-deploy" (deploy, with required reviewers)
#   - Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP
#   - A federated credential on the Entra app registration for each environment (no client secret)
#   - The app registration has Reader (what-if) and Contributor (deploy) on the sandbox resource group only
name: Deploy example (what-if, then deploy)

on:
  workflow_dispatch:
    inputs:
      modules_ref:
        description: Tag or commit SHA of the modules repository to deploy from
        required: true
        default: azure-bicep/v0.1.0
      deploy:
        description: Deploy after the what-if. The deploy job still waits for approval.
        type: boolean
        default: false

# Nothing here needs write access to the repository
permissions:
  contents: read

env:
  MODULES_REPOSITORY: your-user/Modules

jobs:
  what-if:
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write # request the OIDC token used by azure/login
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check out the modules at a pinned ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.MODULES_REPOSITORY }}
          ref: ${{ inputs.modules_ref }}
          path: .modules
          persist-credentials: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --parameters main.bicepparam

  deploy:
    needs: what-if
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment: sandbox-deploy # configure required reviewers on this environment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check out the modules at the same pinned ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.MODULES_REPOSITORY }}
          ref: ${{ inputs.modules_ref }}
          path: .modules
          persist-credentials: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          RUN_ID: ${{ github.run_id }}
        run: |
          az deployment group create \
            --name "deploy-${RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --parameters main.bicepparam
