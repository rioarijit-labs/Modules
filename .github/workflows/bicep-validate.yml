name: Bicep validate

on:
  pull_request:
    paths:
      - "Bicep/**"
      - ".github/workflows/bicep-validate.yml"
  push:
    branches: [main, development]
    paths:
      - "Bicep/**"
      - ".github/workflows/bicep-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Bicep CLI
        run: |
          az bicep install
          echo "$HOME/.azure/bin" >> "$GITHUB_PATH"

      - name: Build, lint and check metadata
        run: python3 Bicep/scripts/validate.py
