name: Bicep validate

on:
  pull_request:
    paths:
      - "Azure/Bicep/**"
      - ".github/workflows/bicep-validate.yml"
  push:
    branches: [main, development]
    paths:
      - "Azure/Bicep/**"
      - ".github/workflows/bicep-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bicep CLI
        run: |
          az bicep install
          echo "$HOME/.azure/bin" >> "$GITHUB_PATH"

      - name: Build, lint and check metadata
        run: python3 Azure/Bicep/scripts/validate.py
