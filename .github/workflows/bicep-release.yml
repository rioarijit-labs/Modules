name: Bicep release

# Push a tag like azure-bicep/v0.1.0 to validate the modules and publish a GitHub release.
on:
  push:
    tags:
      - "azure-bicep/v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bicep CLI
        run: |
          az bicep install
          echo "$HOME/.azure/bin" >> "$GITHUB_PATH"

      - name: Build, lint and check metadata
        run: python3 Azure/Bicep/scripts/validate.py

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish release
        run: |
          if ! [[ "$TAG" =~ ^azure-bicep/v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must look like azure-bicep/v1.2.3" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          version="${TAG#azure-bicep/}"
          archive="azure-bicep-modules-${version}.zip"

          git archive --format=zip --prefix="azure-bicep-modules-${version}/" -o "$archive" HEAD Azure/Bicep

          flags=(--generate-notes --verify-tag)
          # Versions below 1.0 may still change incompatibly
          if [ "$major" = "0" ]; then flags+=(--prerelease); fi

          gh release create "$TAG" "$archive" --repo "$GITHUB_REPOSITORY" --title "Azure Bicep modules ${version}" "${flags[@]}"
