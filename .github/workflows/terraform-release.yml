name: Terraform release

# Push a tag like terraform/v0.1.0 to validate the modules and publish a GitHub release.
on:
  push:
    tags:
      - "terraform/v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Format, validate and check metadata
        run: python3 Terraform/scripts/validate.py

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Publish release
        run: |
          if ! [[ "$TAG" =~ ^terraform/v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must look like terraform/v1.2.3" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          version="${TAG#terraform/}"
          archive="terraform-modules-${version}.zip"

          git archive --format=zip --prefix="terraform-modules-${version}/" -o "$archive" HEAD Terraform

          flags=(--generate-notes --verify-tag)
          # Versions below 1.0 may still change incompatibly
          if [ "$major" = "0" ]; then flags+=(--prerelease); fi

          gh release create "$TAG" "$archive" --repo "$GITHUB_REPOSITORY" --title "Terraform modules ${version}" "${flags[@]}"
